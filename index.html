<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>트레일플라이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 산행 뒤의 들뜬 기분, 하지만 도구처럼 단정하게
   IDEA: 탁자 위에 올려 둔 입체 지형 모형 위를 따라 나는 카메라
   PICTURE: GPX 고도로 깎아 낸 지형 디오라마와 주황 경로선, 그것이 곧 화면
   COLOUR and TYPE: 가문비 숲빛 바탕, 하늘빛 무대, 신호 주황 하나 / Barlow Condensed 숫자 + Noto Sans KR
   LAYOUT: 왼쪽 무대가 화면을 채우고 오른쪽 패널에 기록·옵션, 좁으면 무대-패널 순서로 쌓기 */
:root{color-scheme:light dark;--bg:light-dark(#eef0ea,#0d1512);--card:light-dark(#ffffff,#15211c);--ink:light-dark(#14211b,#e8eee7);--mut:light-dark(#5b6a61,#9aab9f);--line:light-dark(#d6ddd3,#273830);--acc:#ff5b23;--accd:light-dark(#d9440f,#ff7a49)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px max(2vw,16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand svg{width:34px;height:34px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;width:100%;font-size:16px}
.btn.primary:hover{background:var(--accd)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:8px;padding:0 max(2vw,16px) 24px;align-items:start}
.stage-col{display:grid;place-items:center}
.stage{--ar:1.7778;position:relative;width:min(100%,calc((100svh - 96px)*var(--ar)));aspect-ratio:var(--ar);border-radius:16px;overflow:hidden;background:linear-gradient(#86abbd,#d3e2e1 64%);touch-action:none;cursor:grab;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(0,0,0,.5)}
.stage:active{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop{position:absolute;inset:10px;border:2px dashed #fff;border-radius:12px;display:none;place-items:center;background:rgba(13,21,18,.55);color:#fff;font-weight:700;font-size:18px;text-align:center;padding:16px}
body.dragging .drop{display:grid}
.msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(13,21,18,.86);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;max-width:90%;text-align:center}
.recbadge{position:absolute;right:12px;top:12px;background:#d91e1e;color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;display:none}
.recording .recbadge{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px}
.panel h1{font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--mut);font-size:14px}
.sample{margin:6px 0 0;font-size:13px;color:var(--accd)}
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin:0}
.totals div{border-top:1px solid var(--line);padding-top:6px}
.totals dt{font-size:13px;color:var(--mut)}
.totals dd{margin:0;font:700 30px/1.05 "Barlow Condensed",sans-serif;white-space:nowrap}
.totals small{font-size:16px;margin-left:3px;font-weight:600}
.scrub{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.play svg{width:18px;height:18px}
#prof{width:100%;height:64px;display:block;cursor:pointer;touch-action:none}
.pa{fill:var(--line)}.pf{fill:var(--acc)}.pl{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.55}
#pcur{stroke:var(--ink);stroke-width:2}.pdot{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink);white-space:nowrap;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px;justify-self:start;padding:6px 0;min-height:32px}
.ph-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph-head b{font-size:15px}.ph-head span{font-size:13px;color:var(--mut)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-top:8px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.photos figcaption{font-size:12px;color:var(--mut);text-align:center}
.photos button{position:absolute;top:2px;right:2px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.empty{font-size:13px;color:var(--mut);margin:6px 0 0}
.note{font-size:13px;color:var(--mut);margin:0}
.maps{border:1px solid var(--line);border-radius:12px;padding:0 12px}
.maps summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500;font-size:15px}
.mapf{display:grid;gap:10px;padding-bottom:12px}
.mapf label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.mapf input,.mapf select{min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0 10px;width:100%}
.mapstat{margin:0;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
.mapstat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mstat,#9aab9f);flex:none}
.modal{position:fixed;inset:0;background:rgba(5,10,8,.7);display:grid;place-items:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:16px;padding:16px;width:min(720px,100%);display:grid;gap:12px;max-height:94svh}
.sheet video{width:100%;max-height:68svh;border-radius:10px;background:#000}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .btn.primary{width:auto}
.sheet p{margin:0;font-size:14px;color:var(--mut)}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{width:min(100%,calc(72svh*var(--ar)))}}
@media(max-width:600px){.top{padding:10px 12px}.wrap{padding:0 12px 20px}.brand span{display:none}.btn{padding:0 12px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#173a2e"/><path d="M4 26 13 13l5 6 4-5 8 12z" fill="#3f7a52"/><path d="M13 13l2.2 3.2-2.2 1-2-1zM22 14l2 2.6-2 .8-1.6-.9z" fill="#eaf1ec"/><path d="M6 23c5-1 6-7 11-6s5 5 11 2" fill="none" stroke="#ff5b23" stroke-width="2.6" stroke-linecap="round"/><circle cx="28" cy="19" r="2.6" fill="#fff" stroke="#ff5b23" stroke-width="1.6"/></svg>
    트레일플라이<span style="font-weight:400;color:var(--mut);font-size:14px">· 기록을 3D 비행 영상으로</span>
  </div>
  <div class="acts">
    <label class="btn">GPX 열기<input type="file" id="gpxIn" accept=".gpx,.tcx,.xml,application/gpx+xml" hidden></label>
    <label class="btn">사진 추가<input type="file" id="phIn" accept="image/*" multiple hidden></label>
  </div>
</header>
<main class="wrap">
  <section class="stage-col">
    <div class="stage" id="stage" aria-label="3D 경로 미리보기. 드래그로 시점 회전, 휠이나 두 손가락으로 확대, 탭하면 재생/일시정지">
      <canvas id="gl"></canvas><canvas id="hud"></canvas>
      <div class="drop">GPX 파일이나 사진을 여기에 놓으세요</div>
      <div class="recbadge" id="recBadge">녹화 중</div>
      <div class="msg" id="msg" hidden></div>
    </div>
  </section>
  <aside class="panel">
    <div>
      <h1 id="tName">경로 불러오는 중</h1>
      <p class="sub" id="tSub"></p>
      <p class="sample" id="tSample" hidden>가상의 예시 경로예요. GPX를 올리면 내 기록으로 바뀌어요.</p>
    </div>
    <dl class="totals" id="totals"></dl>
    <div class="scrub">
      <button class="play" id="play" aria-label="재생"></button>
      <svg id="prof" role="slider" aria-label="경로 위치" tabindex="0"></svg>
    </div>
    <div class="opts">
      <div class="opt"><span>카메라</span><div class="seg" data-k="cam"><button data-v="follow">추적</button><button data-v="drone">드론</button><button data-v="top">위에서</button></div></div>
      <div class="opt"><span>영상 길이</span><div class="seg" data-k="dur"><button data-v="30">30초</button><button data-v="45">45초</button><button data-v="60">60초</button></div></div>
      <div class="opt"><span>화면</span><div class="seg" data-k="fmt"><button data-v="h">가로 16:9</button><button data-v="v">세로 9:16</button></div></div>
      <div class="opt"><span>지형 높이</span><div class="seg" data-k="ex"><button data-v="1">1배</button><button data-v="1.5">1.5배</button><button data-v="2.2">2.2배</button></div></div>
      <button class="linkbtn" id="resetView">시점 초기화</button>
    </div>
    <div>
      <div class="ph-head"><b>사진</b><span id="phCount">0장</span></div>
      <div class="photos" id="photos"></div>
      <p class="empty" id="phEmpty">사진을 추가하면 찍은 위치나 시간에 맞춰 비행 중간에 나타나요.</p>
    </div>
    <details class="maps" id="mapsBox">
      <summary>지도 데이터 설정</summary>
      <div class="mapf">
        <label>위성 사진<select id="satSel"><option value="auto">자동 (국내는 브이월드, 해외는 MapTiler)</option><option value="vworld">브이월드</option><option value="maptiler">MapTiler</option><option value="esri">Esri World Imagery (키 없음)</option><option value="none">사용 안 함</option></select></label>
        <label>브이월드 인증키<input id="vwKey" type="password" autocomplete="off" spellcheck="false" placeholder="vworld.kr에서 발급"></label>
        <label>MapTiler 키<input id="mtKey" type="password" autocomplete="off" spellcheck="false" placeholder="maptiler.com에서 발급"></label>
        <button class="btn" id="mapApply">적용하고 다시 불러오기</button>
        <p class="note">키는 이 브라우저에만 저장돼요. 실제 지형은 AWS Terrain Tiles에서 키 없이 받아요.</p>
      </div>
    </details>
    <p class="mapstat" id="mapStat">지도 준비 중</p>
    <button class="btn primary" id="rec">영상 만들기</button>
    <p class="note" id="terrNote">기록과 사진은 이 브라우저 안에서만 처리돼요.</p>
  </aside>
</main>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-label="만든 영상">
    <video id="vid" controls playsinline loop></video>
    <p id="saveMsg"></p>
    <div class="row"><button class="btn" id="closeM">닫기</button><button class="btn primary" id="saveV">영상 저장</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const stage=$('#stage'),glc=$('#gl'),hud=$('#hud'),hctx=hud.getContext('2d');
let msgTimer=0;
function showMsg(t,ms){const m=$('#msg');m.textContent=t;m.hidden=false;clearTimeout(msgTimer);if(ms!==0)msgTimer=setTimeout(()=>m.hidden=true,ms||3200)}
if(!window.THREE){showMsg('3D 엔진을 불러오지 못했어요. 새로고침해 주세요.',0);return}
const V=THREE.Vector3;
const ICON_PLAY='<svg viewBox="0 0 18 18"><path d="M4 2.5v13l11-6.5z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 18 18"><path d="M4 2.5h3.6v13H4zM10.4 2.5H14v13h-3.6z" fill="currentColor"/></svg>';

const S={cam:'follow',dur:45,fmt:'h',ex:1.5,playing:false,time:0,total:1,yaw:0,pitch:1,zoom:1,rec:null};
try{const sv=JSON.parse(localStorage.getItem('trailfly')||'{}');for(const k of ['cam','dur','fmt','ex'])if(sv[k]!=null)S[k]=sv[k]}catch(e){}
function saveOpts(){try{localStorage.setItem('trailfly',JSON.stringify({cam:S.cam,dur:S.dur,fmt:S.fmt,ex:S.ex}))}catch(e){}}

let T=null,C=null,G=null,OV=null,FD=100,timeline=[];
const photos=[];

/* ---------- parsing ---------- */
function parseTrack(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('파일을 읽을 수 없어요');
  const tag=(el,n)=>el.getElementsByTagNameNS('*',n)[0];
  let nodes=[...doc.getElementsByTagNameNS('*','trkpt')];
  if(!nodes.length)nodes=[...doc.getElementsByTagNameNS('*','rtept')];
  const pts=[];
  if(nodes.length){
    for(const n of nodes){const e=tag(n,'ele'),t=tag(n,'time');pts.push({lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),e:e?parseFloat(e.textContent):NaN,t:t?Date.parse(t.textContent):NaN})}
  }else{
    for(const n of doc.getElementsByTagNameNS('*','Trackpoint')){const la=tag(n,'LatitudeDegrees'),lo=tag(n,'LongitudeDegrees');if(!la||!lo)continue;const e=tag(n,'AltitudeMeters'),t=tag(n,'Time');pts.push({lat:+la.textContent,lon:+lo.textContent,e:e?parseFloat(e.textContent):NaN,t:t?Date.parse(t.textContent):NaN})}
  }
  const nm=tag(doc,'trk')&&tag(tag(doc,'trk'),'name')||tag(doc,'name')||tag(doc,'Name');
  return {pts,name:nm?nm.textContent.trim():''};
}
function prepTrack(raw,name,sample){
  let pts=raw.filter(p=>isFinite(p.lat)&&isFinite(p.lon)&&Math.abs(p.lat)<=90);
  if(pts.length<2)throw new Error('경로 지점이 너무 적어요');
  let la=0,lo=0;for(const p of pts){la+=p.lat;lo+=p.lon}la/=pts.length;lo/=pts.length;
  const kx=111320*Math.cos(la*Math.PI/180),kz=110574;
  const hasE=pts.some(p=>isFinite(p.e));
  if(hasE){let l=pts.find(p=>isFinite(p.e)).e;for(const p of pts){if(isFinite(p.e))l=p.e;else p.e=l}}else pts.forEach(p=>p.e=0);
  const hasT=pts.filter(p=>isFinite(p.t)).length>pts.length*.8;
  if(hasT){let l=pts.find(p=>isFinite(p.t)).t;for(const p of pts){if(isFinite(p.t)&&p.t>=l)l=p.t;else p.t=l}}
  for(const p of pts){p.x=(p.lon-lo)*kx;p.z=-(p.lat-la)*kz}
  const q=[pts[0]];for(let i=1;i<pts.length;i++){const a=q[q.length-1],p=pts[i];if(Math.hypot(p.x-a.x,p.z-a.z)>.8)q.push(p)}
  if(q.length<2)throw new Error('경로가 너무 짧아요');
  const es=q.map((p,i)=>{let s=0,n=0;for(let k=-4;k<=4;k++){const r=q[i+k];if(r){s+=r.e;n++}}return s/n});
  let d=0,asc=0,maxE=-1e9,minE=1e9;
  q.forEach((p,i)=>{p.es=es[i];if(i){d+=Math.hypot(p.x-q[i-1].x,p.z-q[i-1].z);asc+=Math.max(0,es[i]-es[i-1])}p.d=d;p.asc=asc;maxE=Math.max(maxE,p.es);minE=Math.min(minE,p.es)});
  const dur=hasT?q[q.length-1].t-q[0].t:NaN;
  return {name:name||'내 기록',sample:!!sample,pts:q,hasE,hasT,lat0:la,lon0:lo,kx,kz,tot:{dist:d,asc,dur,maxE,minE}};
}
function sampleRaw(){
  const N=1100,out=[],lat0=37.75,lon0=128.4,kx=111320*Math.cos(lat0*Math.PI/180),kz=110574;
  let t=Date.parse('2026-10-17T23:30:00Z'),px=null,pz=0,pe=0;
  for(let i=0;i<N;i++){
    const s=i/(N-1),a=s*Math.PI*2,r=1+.22*Math.sin(3*a+.4)+.08*Math.sin(9*a);
    const x=Math.cos(a)*r*1750+260*Math.sin(2*a),z=Math.sin(a)*r*1150;
    const e=420+760*Math.exp(-(((s-.4)/.16)**2))+240*Math.exp(-(((s-.72)/.08)**2))+18*Math.sin(s*90);
    if(px!==null){const d=Math.hypot(x-px,z-pz),g=(e-pe)/Math.max(d,1),v=clamp(1.3/(1+Math.max(0,g)*9+Math.max(0,-g)*3),.35,1.5);t+=d/v*1000;if(i===Math.round(N*.4))t+=25*60000}
    out.push({lat:lat0-z/kz,lon:lon0+x/kx,e,t});px=x;pz=z;pe=e;
  }
  return out;
}

/* ---------- EXIF ---------- */
function exifInfo(buf){
  const v=new DataView(buf);if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};
  let o=2;
  while(o+4<v.byteLength){const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)break;const len=v.getUint16(o+2);if(m===0xFFE1&&o+10<v.byteLength&&v.getUint32(o+4)===0x45786966)return tiff(v,o+10);o+=2+len}
  return {};
}
function tiff(v,b){
  const le=v.getUint16(b)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le),res={};
  const ifd=(off,cb)=>{const p=b+off;if(p+2>v.byteLength)return;const n=u16(p);for(let i=0;i<n;i++){const e=p+2+i*12;if(e+12>v.byteLength)return;cb(u16(e),u32(e+4),e+8)}};
  const str=(c,vo)=>{const p=c>4?b+u32(vo):vo;let s='';for(let i=0;i<c-1&&p+i<v.byteLength;i++)s+=String.fromCharCode(v.getUint8(p+i));return s};
  const rats=(c,vo)=>{const p=b+u32(vo),a=[];for(let i=0;i<c;i++){if(p+i*8+8>v.byteLength)break;a.push(u32(p+i*8)/(u32(p+i*8+4)||1))}return a};
  let ex=0,gp=0;

  if(T.hasT){o.el=lerp(C.t[a],C.t[b],f)-C.t[0];const i0=Math.max(0,a-4),i1=Math.min(C.t.length-1,a+5),dt=(C.t[i1]-C.t[i0])/1000;o.v=dt>0?clamp((C.d[i1]-C.d[i0])/dt*3.6,0,250):0}return o}
function uFromD(d){const c=C.d;let lo=0,hi=c.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=d)lo=m;else hi=m}const s=c[hi]-c[lo],f=s>0?clamp((d-c[lo])/s,0,1):0;return lerp(C.cum[lo],C.cum[hi],f)/C.L}

/* ---------- photos ---------- */
function placePhotos(){
  const loose=[];
  for(const ph of photos){ph.u=null;const inf=ph.info;
    if(inf.lat!=null){const x=((inf.lon-T.lon0)*T.kx),z=-(inf.lat-T.lat0)*T.kz;let best=1e18,bi=0;T.pts.forEach((p,i)=>{const d=(p.x-x)**2+(p.z-z)**2;if(d<best){best=d;bi=i}});if(Math.sqrt(best)<3000){ph.u=uFromD(T.pts[bi].d);ph.how='위치'}}
    if(ph.u==null&&T.hasT&&inf.time){const t0=C.t[0],t1=C.t[C.t.length-1];if(inf.time>t0-36e5&&inf.time<t1+36e5){let bi=0,best=1e18;C.t.forEach((t,i)=>{const d=Math.abs(t-inf.time);if(d<best){best=d;bi=i}});ph.u=C.cum[bi]/C.L;ph.how='시간'}}
    if(ph.u==null)loose.push(ph)}
  loose.forEach((ph,j)=>{ph.u=(j+1)/(loose.length+1);ph.how='순서'});
  photos.forEach(p=>p.u=clamp(p.u,.02,.98));photos.sort((a,b)=>a.u-b.u);
}
function buildPhotoMarkers(){
  if(!photoGroup)return;while(photoGroup.children.length){const o=photoGroup.children[0];photoGroup.remove(o);o.traverse(c=>c.geometry&&c.geometry.dispose())}
  const h=FD*.3,r=FD*.035;
  for(const ph of photos){const g=new THREE.Group(),p=posAt(ph.u,new V());const pole=new THREE.Mesh(new THREE.CylinderGeometry(r*.12,r*.12,h,5),poleMat);pole.position.y=h/2;const gem=new THREE.Mesh(new THREE.OctahedronGeometry(r),markMat);gem.position.y=h+r;g.add(pole,gem);g.position.copy(p);photoGroup.add(g)}
}
function renderPhotoList(){
  const box=$('#photos');box.textContent='';
  photos.forEach((ph,i)=>{const f=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption'),b=document.createElement('button');
    im.src=ph.url;im.alt=ph.name;cap.textContent=ph.how+' 기준';b.textContent='×';b.setAttribute('aria-label',ph.name+' 빼기');
    b.onclick=()=>{const u=curU();URL.revokeObjectURL(ph.url);photos.splice(photos.indexOf(ph),1);buildPhotoMarkers();buildTimeline();seekU(u);renderPhotoList();drawProfile()};
    f.append(im,b,cap);box.append(f)});
  $('#phCount').textContent=photos.length+'장';$('#phEmpty').hidden=photos.length>0;
}
async function addPhotos(files){
  let bad=0;const u=curU();
  for(const f of files){if(!f.type.startsWith('image/'))continue;let info={};
    try{info=exifInfo(await f.slice(0,262144).arrayBuffer())}catch(e){}
    const url=URL.createObjectURL(f),img=new Image();img.src=url;
    try{await img.decode()}catch(e){bad++;URL.revokeObjectURL(url);continue}
    photos.push({name:f.name,url,img,info})}
  if(bad)showMsg('열 수 없는 사진 '+bad+'장은 건너뛰었어요 (HEIC는 JPG로 바꿔 주세요)');
  placePhotos();buildPhotoMarkers();buildTimeline();seekU(u);renderPhotoList();drawProfile();
}

/* ---------- timeline ---------- */
const INTRO=3.2,OUTRO=5,HOLD=2.8;
function buildTimeline(){
  timeline=[];let t=0,u=0;const D=S.dur;
  timeline.push({k:'intro',t0:0,t1:INTRO,u0:0,u1:0});t=INTRO;
  for(const p of photos){const dt=(p.u-u)*D;if(dt>0){timeline.push({k:'move',t0:t,t1:t+dt,u0:u,u1:p.u});t+=dt}timeline.push({k:'photo',t0:t,t1:t+HOLD,u0:p.u,u1:p.u,p});t+=HOLD;u=p.u}
  timeline.push({k:'move',t0:t,t1:t+(1-u)*D,u0:u,u1:1});t+=(1-u)*D;
  timeline.push({k:'outro',t0:t,t1:t+OUTRO,u0:1,u1:1});S.total=t+OUTRO;
  S.time=Math.min(S.time,S.total);
}
function stateAt(t){for(const g of timeline)if(t<=g.t1){const a=g.t1>g.t0?clamp((t-g.t0)/(g.t1-g.t0),0,1):1;return {k:g.k,a,u:lerp(g.u0,g.u1,a),p:g.p}}const g=timeline[timeline.length-1];return {k:g.k,a:1,u:1}}
function curU(){return timeline.length?stateAt(S.time).u:0}

/* ---------- camera ---------- */
const cA={pos:new V(),tgt:new V()},cB={pos:new V(),tgt:new V()},tA=new V(),tB=new V(),tP=new V();
function follow(u,o){
  posAt(u,tP);const w=Math.min(.05,FD*1.3/C.L);posAt(u-w,tA);posAt(u+w*2,tB);
  let dx=tB.x-tA.x,dz=tB.z-tA.z,l=Math.hypot(dx,dz);if(l<1e-6){dx=0;dz=-1;l=1}dx/=l;dz/=l;
  let dist=FD*S.zoom,h,back=1;
  if(S.cam==='drone'){dist*=2.3;h=dist*.75*S.pitch}else if(S.cam==='top'){dist*=1.15;h=dist*3.2*S.pitch;back=.22}else h=dist*.5*S.pitch;
  const c=Math.cos(S.yaw),s=Math.sin(S.yaw),rx=dx*c-dz*s,rz=dx*s+dz*c;
  o.pos.set(tP.x-rx*dist*back,tP.y+h,tP.z-rz*dist*back);
  const g=terrH(o.pos.x,o.pos.z)+FD*.25;if(o.pos.y<g)o.pos.y=g;
  o.tgt.set(tP.x+dx*dist*.22,tP.y,tP.z+dz*dist*.22);
}
function overview(a,o){const R=OV.r;o.tgt.set(OV.cx,OV.cy,OV.cz);o.pos.set(OV.cx+Math.sin(a)*R*1.25,OV.cy+R*1.1,OV.cz+Math.cos(a)*R*1.25)}
function placeCamera(st){
  if(st.k==='intro'){overview(OV.a0,cA);follow(0,cB);const e=ease(sstep(.15,1,st.a));cA.pos.lerp(cB.pos,e);cA.tgt.lerp(cB.tgt,e)}
  else if(st.k==='outro'){follow(1,cA);overview(OV.a0+st.a*.9,cB);const e=ease(sstep(0,.55,st.a));cA.pos.lerp(cB.pos,e);cA.tgt.lerp(cB.tgt,e)}
  else follow(st.u,cA);
  camera.position.copy(cA.pos);camera.lookAt(cA.tgt);

const ro=new ResizeObserver(resize);ro.observe(stage);

/* ---------- recording ---------- */
let dl=null,lastVid=null;
if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
async function record(){
  if(S.rec){S.rec.cancel=true;if(!S.rec.stopping){S.rec.stopping=true;S.rec.mr.stop()}return}
  if(!window.MediaRecorder||!glc.captureStream){showMsg('이 브라우저는 영상 녹화를 지원하지 않아요. 최신 Chrome이나 Safari에서 열어 주세요.');return}
  const [W,H]=S.fmt==='v'?[720,1280]:[1280,720];
  const rcv=document.createElement('canvas');rcv.width=W;rcv.height=H;
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  let mr;try{mr=new MediaRecorder(rcv.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:8e6}:{})}catch(e){showMsg('녹화를 시작하지 못했어요.');return}

  S.rec={mr,ctx:rcv.getContext('2d'),w:W,h:H,s:Math.min(W,H)/720,hold:0,stopping:false,cancel:false};
  document.body.classList.add('recording');stage.classList.add('recording');
  const done=new Promise(r=>mr.onstop=r);
  S.time=0;setPlay(true);mr.start(250);
  await done;
  const R=S.rec;S.rec=null;setPlay(false);document.body.classList.remove('recording');stage.classList.remove('recording');$('#rec').textContent='영상 만들기';resize();
  if(R.cancel){showMsg('녹화를 취소했어요');return}
  const type=mr.mimeType||mime||'video/webm',blob=new Blob(chunks,{type});
  if(!blob.size){showMsg('영상이 비어 있어요. 다시 시도해 주세요.');return}
  if(lastVid)URL.revokeObjectURL(lastVid.url);
  lastVid={blob,url:URL.createObjectURL(blob),ext:type.includes('mp4')?'mp4':'webm'};
  $('#vid').src=lastVid.url;$('#modal').hidden=false;
  $('#saveV').hidden=!dl;$('#saveMsg').textContent=dl?(lastVid.ext.toUpperCase()+' · '+(blob.size/1048576).toFixed(1)+'MB'):'이 화면에서는 파일 저장을 지원하지 않아요. claude.ai를 컴퓨터 브라우저로 열면 저장할 수 있어요.';
}
$('#saveV').onclick=async()=>{if(!dl||!lastVid)return;const nm=(T.name||'trailfly').replace(/[\\/:*?"<>|]/g,'').slice(0,60)||'trailfly';
  try{await dl.save({filename:nm+'.'+lastVid.ext,data:lastVid.blob});$('#saveMsg').textContent='저장했어요.'}
  catch(e){const c=e&&e.code;$('#saveMsg').textContent=c==='declined'?'저장을 취소했어요.':c==='rate_limited'?'잠시 후 다시 눌러 주세요.':c==='host_unavailable'?'이 앱에서는 저장할 수 없어요. 브라우저에서 열어 주세요.':'저장하지 못했어요.'}};
$('#closeM').onclick=()=>{$('#modal').hidden=true;$('#vid').pause()};
$('#rec').onclick=record;

/* ---------- inputs ---------- */
function applyFmt(){stage.style.setProperty('--ar',S.fmt==='v'?.5625:1.7778)}
document.querySelectorAll('.seg').forEach(seg=>{const k=seg.dataset.k;
  const mark=()=>seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(S[k]))));mark();
  seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||S.rec)return;const v=k==='dur'||k==='ex'?parseFloat(b.dataset.v):b.dataset.v;if(v===S[k])return;
    const u=curU(),st=stateAt(S.time);S[k]=v;mark();saveOpts();
    if(k==='cam'){S.yaw=0;S.pitch=1;S.zoom=1}else if(k==='dur'){buildTimeline();if(st.k==='move'||st.k==='photo')seekU(u)}else if(k==='fmt')applyFmt();else if(k==='ex'){buildWorld()}})});
$('#resetView').onclick=()=>{S.yaw=0;S.pitch=1;S.zoom=1};
$('#play').onclick=togglePlay;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON|TEXTAREA/.test(e.target.tagName)&&$('#modal').hidden){e.preventDefault();togglePlay()}});
const prof=$('#prof');
const seekProf=e=>{const r=prof.getBoundingClientRect(),f=clamp((e.clientX-r.left)/r.width,0,1);seekU(uFromD(f*T.tot.dist))};
prof.addEventListener('pointerdown',e=>{if(S.rec)return;prof.setPointerCapture(e.pointerId);seekProf(e)});
prof.addEventListener('pointermove',e=>{if(prof.hasPointerCapture(e.pointerId))seekProf(e)});
prof.addEventListener('keydown',e=>{if(S.rec)return;const d=e.key==='ArrowRight'?.02:e.key==='ArrowLeft'?-.02:0;if(d){e.preventDefault();seekU(clamp(curU()+d,0,1))}});
const ptrs=new Map();let down=null,moved=false,pin0=0,zoom0=1;
stage.addEventListener('pointerdown',e=>{if(S.rec)return;stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){down={x:e.clientX,y:e.clientY};moved=false}else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pin0=Math.hypot(a.x-b.x,a.y-b.y)||1;zoom0=S.zoom;moved=true}});
stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)moved=true;if(moved){S.yaw-=dx*.006;S.pitch=clamp(S.pitch+dy*.004,.25,2.6)}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];S.zoom=clamp(zoom0*pin0/(Math.hypot(a.x-b.x,a.y-b.y)||1),.35,3)}});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(!ptrs.size&&!moved&&e.type==='pointerup')togglePlay()};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{if(S.rec)return;e.preventDefault();S.zoom=clamp(S.zoom*Math.exp(e.deltaY*.001),.35,3)},{passive:false});

async function loadGpxFile(f){
  try{const txt=await f.text(),r=parseTrack(txt);loadTrack(prepTrack(r.pts,r.name||f.name.replace(/\.[^.]+$/,''),false));showMsg('경로를 불러왔어요')}
  catch(e){showMsg((e&&e.message)||'GPX를 읽지 못했어요')}
}
function loadTrack(t){if(T&&T.sat&&T.sat.tex)T.sat.tex.dispose();T=t;buildWorld();
  if(t.sample){dataTok++;setStat('예시 경로는 모형 지형으로 보여 줘요. GPX를 열면 실제 지도를 불러와요.')}else fetchMaps();placePhotos();buildPhotoMarkers();renderMeta();buildTimeline();renderPhotoList();drawProfile();S.time=0;S.yaw=0;S.pitch=1;S.zoom=1;lastFr=-1;setPlay(true)}
$('#satSel').value=M.sat;$('#vwKey').value=M.vw;$('#mtKey').value=M.mt;
if(!M.vw&&!M.mt)$('#mapsBox').open=true;
$('#mapApply').onclick=()=>{M.sat=$('#satSel').value;M.vw=$('#vwKey').value.trim();M.mt=$('#mtKey').value.trim();
  try{localStorage.setItem('trailfly-maps',JSON.stringify(M))}catch(e){}
  if(T&&!T.sample)fetchMaps();else showMsg('저장했어요. GPX를 열면 이 설정으로 지도를 불러와요.')};
$('#gpxIn').onchange=e=>{const f=e.target.files[0];if(f)loadGpxFile(f);e.target.value=''};
$('#phIn').onchange=e=>{addPhotos([...e.target.files]);e.target.value=''};
let dragN=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragN++;document.body.classList.add('dragging')});
window.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('dragging')}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('dragging');const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])];
  const g=fs.find(f=>/\.(gpx|tcx|xml)$/i.test(f.name));const ims=fs.filter(f=>f.type.startsWith('image/'));
  (async()=>{if(g)await loadGpxFile(g);if(ims.length)addPhotos(ims)})()});

applyFmt();resize();
try{loadTrack(prepTrack(sampleRaw(),'예시 산행 · 능선 한 바퀴',true))}catch(e){showMsg('예시 경로를 만들지 못했어요',0)}
setPlay(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{lastFr=-1});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
